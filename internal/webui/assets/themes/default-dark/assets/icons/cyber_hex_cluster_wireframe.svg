<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- 节点 1: 左上终端六边形 (Cyan Wireframe) -->
  <g class="hex-node-1">
    <path d="M58 7 L77.5 18.25 V40.75 L58 52 L38.5 40.75 V18.25 Z"
          stroke="#90aed7" stroke-width="2" stroke-linejoin="round"/>
    <!-- 内部终端线框 -->
    <rect x="50" y="21.5" width="16" height="11" rx="1.5" stroke="#90aed7" stroke-width="1.4"/>
    <path d="M53 25 L55.5 27 L53 29 M57.5 29 H61" stroke="#90aed7" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="58" cy="37" r="1.2" fill="#90aed7"/>
  </g>

  <!-- 节点 2: 正左终端六边形 (Cyan Wireframe) -->
  <g class="hex-node-2">
    <path d="M38 41.5 L57.5 52.75 V75.25 L38 86.5 L18.5 75.25 V52.75 Z"
          stroke="#90aed7" stroke-width="2" stroke-linejoin="round"/>
    <!-- 内部终端线框 -->
    <rect x="30" y="56" width="16" height="11" rx="1.5" stroke="#90aed7" stroke-width="1.4"/>
    <path d="M33 59.5 L35.5 61.5 L33 63.5 M37.5 63.5 H41" stroke="#90aed7" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="38" cy="71.5" r="1.2" fill="#90aed7"/>
  </g>

  <!-- 节点 3: 左下终端六边形 (Cyan Wireframe) -->
  <g class="hex-node-3">
    <path d="M58 76 L77.5 87.25 V109.75 L58 121 L38.5 109.75 V87.25 Z"
          stroke="#90aed7" stroke-width="2" stroke-linejoin="round"/>
    <!-- 内部终端线框 -->
    <rect x="50" y="90.5" width="16" height="11" rx="1.5" stroke="#90aed7" stroke-width="1.4"/>
    <path d="M53 94 L55.5 96 L53 98 M57.5 98 H61" stroke="#90aed7" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="58" cy="106" r="1.2" fill="#90aed7"/>
  </g>

  <!-- 拓扑数据互通线路 (Cyan to Yellow Bridge) -->
  <g class="hex-links" stroke-linecap="round">
    <!-- 节点1连线 -->
    <path d="M66 35 L72 39 V52" stroke="#90aed7" stroke-width="1.5" stroke-dasharray="3 2"/>
    <circle cx="72" cy="52" r="1.5" fill="#a4afc0"/>
    <!-- 节点2连线 -->
    <path d="M46 64 H69" stroke="#90aed7" stroke-width="1.5" stroke-dasharray="3 2"/>
    <circle cx="69" cy="64" r="1.5" fill="#a4afc0"/>
    <!-- 节点3连线 -->
    <path d="M66 93 L72 89 V76" stroke="#90aed7" stroke-width="1.5" stroke-dasharray="3 2"/>
    <circle cx="72" cy="76" r="1.5" fill="#a4afc0"/>
  </g>

  <!-- 节点 4: 右侧小房子宿主六边形 (Yellow Wireframe) -->
  <g class="hex-host">
    <path d="M78 41.5 L97.5 52.75 V75.25 L78 86.5 L58.5 75.25 V52.75 Z"
          stroke="#a4afc0" stroke-width="2" stroke-linejoin="round"/>
    <!-- 内部小房子纯线稿 -->
    <path d="M69 63 L78 54 L87 63" stroke="#a4afc0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M70.5 63 V75 H85.5 V63" stroke="#a4afc0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 天线与信号发射点 -->
    <path d="M83 56 V48.5" stroke="#a4afc0" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="83" cy="47.5" r="1.2" fill="#a4afc0"/>
    <!-- 门 / 核心接口 -->
    <path d="M75.5 75 V67 H80.5 V75" stroke="#a4afc0" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
</svg>
