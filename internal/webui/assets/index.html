/* Apply persisted theme before paint to avoid a flash. */
(function(){try{var t=localStorage.getItem('termcp2.theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);}else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches){document.documentElement.setAttribute('data-theme','light');}}catch(e){}})();
</script>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo"><svg class="ic"><use href="#i-term"/></svg></div>
      <span class="brand-name">termcp</span>
      <span class="badge-dev" id="versionBadge">…</span>
    </div>
    <div class="search" id="globalSearch">
      <svg class="ic"><use href="#i-search"/></svg>
      <input id="searchInput" placeholder="搜索主机或会话…" autocomplete="off">
      <span class="kbd">/</span>
    </div>
    <div class="top-actions">
      <button class="iconbtn" id="approvalBtn" title="审阅队列"><svg class="ic"><use href="#i-shield"/></svg><span class="cnt" id="approvalCount" hidden>0</span></button>
      <button class="iconbtn" id="notifyBtn" title="通知"><svg class="ic"><use href="#i-bell"/></svg></button>
      <div class="vdiv"></div>
      <button class="iconbtn" id="themeToggle" title="切换主题"><svg class="ic" id="themeIcon"><use href="#i-sun"/></svg></button>
      <a class="btn-api" href="/api.html" target="_blank" rel="noopener"><svg class="ic sm"><use href="#i-book"/></svg>MCP / API</a>
    </div>
  </header>

  <div class="body">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main">
      <div class="session-tabs" id="sessionTabs"></div>
      <div class="workspace" id="workspace"></div>
    </main>
    <aside class="inspector" id="inspector"></aside>
  </div>

  <footer class="statusbar" id="statusbar"></footer>
</div>

<div class="modal-root" id="modalRoot"></div>
<div class="toast-root" id="toastRoot"></div>

<script type="module" src="js/app.js"></script>
</body>
