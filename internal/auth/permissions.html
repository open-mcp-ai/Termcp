<body>
<header><a class="brand" href="/">Termcp</a><nav><a href="/" data-text="workspace">工作区</a><a href="/permissions" aria-current="page" data-text="title">权限管理</a><a href="/auth" data-text="account">账号</a></nav><select id="language" aria-label="Language"><option value="zh">中文</option><option value="en">English</option></select></header>
<div class="page-heading"><div><h1 data-text="title">权限管理</h1></div><form id="role-form" class="role-controls"><details><summary data-text="instanceAccess">实例访问开关</summary><div class="role-controls"><label><input id="admin-mcp" type="checkbox"><span data-text="adminMCP">管理员 MCP</span></label><label><input id="agent-mcp" type="checkbox"><span data-text="agentMCP">Agent MCP</span></label><button type="submit" data-text="saveRoles">保存开关</button></div></details></form></div>
<div id="feedback" role="status" aria-live="polite" data-text="intro">先选择或新建 Agent，再勾选功能权限和可访问主机。</div>
<main class="workspace">
<aside aria-label="Agents"><div class="sidebar-head"><h2>Agents</h2><button id="new-agent" type="button" data-text="newAgent">新增</button></div><div id="agent-list" class="agent-list" aria-label="Agent 列表"></div><div id="new-agent-form-wrap" class="create-agent" hidden><form id="new-agent-form"><label class="field"><span data-text="agentName">Agent 名称</span><input id="agent-name" type="text" maxlength="128" required></label><button class="primary" type="submit" data-text="createAgent">创建并配置权限</button><p id="create-error" class="inline-message" role="alert"></p></form></div></aside>
<section class="detail"><div id="workspace-empty"><div><h2 data-text="selectAgent">选择一个 Agent</h2><p data-text="emptyHint">从左侧新增 Agent，然后配置功能和主机范围。</p></div></div><div id="detail-heading" class="detail-heading" hidden><div><h2 id="selected-name"></h2><p id="selected-meta" class="status-dot"></p></div><button id="toggle-agent" type="button"></button></div><div id="tabs" class="tabs" role="tablist" aria-label="Agent 配置" hidden><button id="policy-tab" type="button" role="tab" aria-controls="policy-pane" aria-selected="true" data-text="policy">权限配置</button><button id="tokens-tab" type="button" role="tab" aria-controls="tokens-pane" aria-selected="false" data-text="tokens">Tokens</button></div>
<div id="policy-pane" class="pane" role="tabpanel" aria-labelledby="policy-tab" hidden><div class="policy-columns"><section><div class="section-head"><h3 data-text="functions">功能权限</h3><button id="select-functions" type="button" data-text="selectAll">全选</button></div><div id="function-grid" class="function-grid"></div><p class="policy-note" data-text="terminalNote">终端命令可读写文件和访问网络；这些开关不提供系统沙箱。</p></section><section><div class="section-head"><h3 data-text="hosts">可访问主机</h3><span id="host-count" class="status-dot"></span></div><div id="host-modes" class="scope-modes"><label><input type="radio" name="host-mode" value="all"><span data-text="allHosts">全部主机</span></label><label><input type="radio" name="host-mode" value="selected"><span data-text="selectedHosts">指定主机</span></label><label><input type="radio" name="host-mode" value="none"><span data-text="noHosts">无主机</span></label></div><p id="scope-note"></p><div id="host-picker"><label class="field"><span data-text="searchHosts">筛选主机</span><input id="host-search" type="text"></label><div id="host-grid" class="host-grid"></div></div><p class="policy-note" data-text="globalNote">修改主机配置和管理扩展需要“全部主机”范围。</p></section></div></div>
<div id="policy-save-bar" class="save-bar" hidden><div><p id="save-state"></p><p id="policy-error" class="inline-message" role="alert"></p></div><button id="save-policy" class="primary" type="button" data-text="savePolicy">保存权限</button></div>
<div id="tokens-pane" class="pane token-pane" role="tabpanel" aria-labelledby="tokens-tab" hidden><h3 data-text="tokens">Tokens</h3><p data-text="tokenHint">每个客户端可以使用独立 token，撤销时只断开对应连接。</p><form id="token-form" class="token-form"><label class="field"><span data-text="clientName">客户端名称</span><input id="token-label" type="text" required maxlength="128"></label><button class="primary" type="submit" data-text="issueToken">签发 token</button></form><p id="token-error" class="inline-message" role="alert"></p><section id="token-result" class="token-result" hidden><div class="result-heading"><div><h3 data-text="copyNow">请立即保存配置</h3><p data-text="oneTime">Token 只展示一次，离开页面前请保存。</p></div><button id="dismiss-token" type="button" data-text="savedClose">已保存，关闭</button></div><label class="field"><span data-text="connection">接入方式</span><select id="config-mode"><option value="http">HTTP /stream</option><option value="sse">SSE /sse</option><option value="stdio">stdio → HTTP</option><option value="daemon">daemon stdio</option></select></label><label class="field"><span data-text="configuration">MCP 配置</span><textarea id="token-config" readonly spellcheck="false"></textarea></label><div class="result-actions"><button id="copy-config" type="button" data-text="copyConfig">复制配置</button><span id="copy-state" role="status"></span></div></section><table class="token-table"><thead><tr><th data-text="clientName">客户端名称</th><th data-text="createdAt">创建日期</th><th data-text="actions">操作</th></tr></thead><tbody id="token-list"></tbody></table><p id="tokens-empty" data-text="noTokens" hidden>尚无 token。保存权限后，为客户端签发 token。</p></div>
</section></main>
<script nonce="{{.Nonce}}">

const copy={zh:{title:'权限管理',workspace:'工作区',account:'账号',instanceAccess:'实例访问开关',adminMCP:'管理员 MCP',agentMCP:'Agent MCP',saveRoles:'保存开关',intro:'先选择或新建 Agent，再勾选功能权限和可访问主机。',newAgent:'新增',agentName:'Agent 名称',createAgent:'创建并配置权限',selectAgent:'选择一个 Agent',emptyHint:'从左侧新增 Agent，然后配置功能和主机范围。',policy:'权限配置',tokens:'Tokens',functions:'功能权限',selectAll:'全选',clearAll:'清空',hosts:'可访问主机',allHosts:'全部主机',selectedHosts:'指定主机',noHosts:'无主机',searchHosts:'筛选主机',globalNote:'修改主机配置和管理扩展需要“全部主机”范围。',terminalNote:'终端命令可读写文件和访问网络；这些开关不提供系统沙箱。',savePolicy:'保存权限',tokenHint:'每个客户端可以使用独立 token，撤销时只断开对应连接。',clientName:'客户端名称',issueToken:'签发 token',copyNow:'请立即保存配置',oneTime:'Token 只展示一次，离开页面前请保存。',savedClose:'已保存，关闭',connection:'接入方式',configuration:'MCP 配置',copyConfig:'复制配置',createdAt:'创建日期',actions:'操作',noTokens:'尚无 token。保存权限后，为客户端签发 token。',admin:'管理员（我）',enabled:'已启用',disabled:'已停用',disable:'停用 Agent',enable:'启用 Agent',saved:'已保存',unsaved:'有未保存的权限更改',policySaved:'权限已保存，客户端下次请求按新权限执行。',working:'正在保存…',network:'连接失败，请检查服务是否运行后重试。',revoke:'撤销',revokeConfirm:'撤销此 token 并断开对应客户端连接？',discard:'放弃未保存的权限更改？',saveFirst:'请先保存或关闭当前展示的 token。',copied:'配置已复制',manualCopy:'请手动复制已选中的配置。',created:'Agent 已创建。请勾选功能与主机范围，然后保存权限。',roleSaved:'实例访问开关已保存。',noneHint:'不允许访问任何主机。',selectedHint:'仅允许勾选的已保存主机；空选即无主机权限。',allHint:'允许访问当前及以后新增的已保存主机。',missing:'已删除或不可用的主机',noMatches:'没有匹配的主机。',globalRemoved:'指定主机模式下已取消“修改主机配置”和“管理扩展”。',tokenSaved:'Token 已签发，请立即保存配置。',loading:'正在加载权限…',adminHint:'管理员身份保留管理权限；此处仅管理管理员的 MCP token。',saveBeforeToken:'请先保存当前权限，再签发 token。'},en:{title:'Permission management',workspace:'Workspace',account:'Account',instanceAccess:'Instance access',adminMCP:'Admin MCP',agentMCP:'Agent MCP',saveRoles:'Save switches',intro:'Select or create an Agent, then choose its functions and accessible hosts.',newAgent:'New',agentName:'Agent name',createAgent:'Create and configure',selectAgent:'Select an Agent',emptyHint:'Create an Agent on the left to choose functions and hosts.',policy:'Permissions',tokens:'Tokens',functions:'Functions',selectAll:'Select all',clearAll:'Clear',hosts:'Accessible hosts',allHosts:'All hosts',selectedHosts:'Selected hosts',noHosts:'No hosts',searchHosts:'Filter hosts',globalNote:'Profile changes and extension management require all hosts.',terminalNote:'Terminal commands can access files and networks using the host’s OS permissions.',savePolicy:'Save permissions',tokenHint:'Use a separate token for each client to revoke connections independently.',clientName:'Client name',issueToken:'Issue token',copyNow:'Save this configuration now',oneTime:'The token is shown once. Save it before leaving.',savedClose:'Saved, close',connection:'Connection',configuration:'MCP configuration',copyConfig:'Copy configuration',createdAt:'Created',actions:'Actions',noTokens:'No tokens yet. Save permissions, then issue a client token.',admin:'Administrator (me)',enabled:'Enabled',disabled:'Disabled',disable:'Disable Agent',enable:'Enable Agent',saved:'Saved',unsaved:'Unsaved permission changes',policySaved:'Permissions saved. Subsequent client requests use the new policy.',working:'Saving…',network:'Connection failed. Check the server, then retry.',revoke:'Revoke',revokeConfirm:'Revoke this token and disconnect its clients?',discard:'Discard unsaved permission changes?',saveFirst:'Save or dismiss the displayed token first.',copied:'Configuration copied',manualCopy:'Copy the selected configuration manually.',created:'Agent created. Choose functions and hosts, then save permissions.',roleSaved:'Instance access saved.',noneHint:'No hosts are accessible.',selectedHint:'Only checked saved hosts are accessible. An empty selection grants none.',allHint:'Includes current and future saved hosts.',missing:'Deleted or unavailable host',noMatches:'No matching hosts.',globalRemoved:'Profile changes and extension management were deselected for selected hosts.',tokenSaved:'Token issued. Save the configuration now.',loading:'Loading permissions…',adminHint:'Admin retains management permissions. This view manages MCP tokens only.',saveBeforeToken:'Save the current permissions before issuing a token.'}};
const t=k=>copy[lang][k]||k;
function el(tag,text){const n=document.createElement(tag);if(text)n.textContent=text;return n;}
function feedback(text,tone='info',target){$('feedback').textContent=text;$('feedback').dataset.tone=tone;if(target)$(target).textContent=text;}
function errorText(text){if(lang!=='zh')return text;return {'a valid Agent name is required':'请输入有效的 Agent 名称，名称前后不能有空格。','token label must contain 1–128 bytes without control characters':'请输入有效的客户端名称，长度不超过 128 字节且不含控制字符。','Agent changed; reload before saving':'此 Agent 已被其他页面修改，请重新加载后再保存。','permissions changed; reload before saving':'实例访问开关已被其他页面修改，请重新加载后再保存。','could not save credentials; reload to check the result':'保存失败，请重新加载确认结果后重试。','profile changes and extension management require all hosts':'修改主机配置和管理扩展需要选择全部主机范围。'}[text]||text;}
function fail(error,target){feedback(error instanceof TypeError?t('network'):errorText(error.message),'error',target);}
async function request(path,options={}){const response=await fetch(path,{...options,headers:{'Content-Type':'application/json','X-Termcp-CSRF':state?.csrf||'',...options.headers}});if(response.status===401){location.assign('/login');throw new Error(t('network'));}const data=await response.json();if(!response.ok)throw new Error(data.error||String(response.status));return data;}
function changed(){return draft&&JSON.stringify(draft)!==original;}
function safeSwitch(){if(revealed){feedback(t('saveFirst'),'error');return false;}return !changed()||confirm(t('discard'));}
function setBusy(value){busy=value;document.querySelectorAll('button').forEach(b=>{b.disabled=value;});updateSave();}
function updateSave(){$('save-policy').disabled=busy||!changed();$('save-state').textContent=t(busy?'working':changed()?'unsaved':'saved');}
function renderLanguage(){document.documentElement.lang=lang;document.title=t('title')+' · Termcp';$('language').value=lang;document.querySelectorAll('[data-text]').forEach(n=>n.textContent=t(n.dataset.text));renderList();if(selected){renderDetail();}else feedback(t('intro'));}
function renderList(){const list=$('agent-list');list.replaceChildren();const add=(id,name,note)=>{const b=el('button',name);b.type='button';b.className='agent-item';b.setAttribute('aria-pressed',String(selected===id));b.append(el('small',note));b.onclick=()=>select(id);list.append(b);};agents.forEach(a=>add(a.id,a.name,t(a.enabled?'enabled':'disabled')));add('admin',t('admin'),'MCP tokens');}
function select(id,force=false){if(!force&&id===selected)return;if(!force&&!safeSwitch())return;selected=id;const a=agents.find(a=>a.id===id);draft=a?JSON.parse(JSON.stringify(a.policy)):null;original=JSON.stringify(draft);tab=id==='admin'?'tokens':'policy';$('policy-error').textContent='';$('token-error').textContent='';renderList();renderDetail();feedback(t('intro'));}
function renderDetail(){const a=agents.find(a=>a.id===selected),admin=selected==='admin';$('workspace-empty').hidden=true;$('detail-heading').hidden=false;$('tabs').hidden=false;$('selected-name').textContent=admin?t('admin'):a.name;$('selected-meta').textContent=admin?t('adminHint'):t(a.enabled?'enabled':'disabled');$('toggle-agent').hidden=admin;$('toggle-agent').textContent=t(a?.enabled?'disable':'enable');$('policy-tab').hidden=admin;setTab(tab);if(a){renderFunctions();renderHosts();}renderTokens();updateSave();}
function setTab(value){tab=value;$('policy-tab').setAttribute('aria-selected',String(value==='policy'));$('tokens-tab').setAttribute('aria-selected',String(value==='tokens'));$('policy-pane').hidden=value!=='policy';$('policy-save-bar').hidden=value!=='policy';$('tokens-pane').hidden=value!=='tokens';}
function renderFunctions(){const grid=$('function-grid');grid.replaceChildren();catalog.functions.forEach(g=>{const label=el('label');label.className='choice';label.title=lang==='zh'?g.description:g.english;const input=el('input');input.type='checkbox';input.value=g.id;input.checked=draft.functions.includes(g.id);input.disabled=draft.host_mode!=='all'&&['profile_write','extension'].includes(g.id);const text=el('span',lang==='zh'?g.name:g.english);if(lang==='zh')text.append(el('small',g.description));label.append(input,text);input.onchange=()=>{draft.functions=input.checked?[...draft.functions,g.id]:draft.functions.filter(id=>id!==g.id);updateSave();};grid.append(label);});}
function renderHosts(){document.querySelectorAll('[name=host-mode]').forEach(n=>n.checked=n.value===draft.host_mode);$('host-count').textContent=draft.host_mode==='selected'?String(draft.hosts.length):'';$('scope-note').textContent=t(draft.host_mode==='all'?'allHint':draft.host_mode==='none'?'noneHint':'selectedHint');$('host-picker').hidden=draft.host_mode!=='selected';const list=$('host-grid');list.replaceChildren();const query=$('host-search').value.toLowerCase();const hosts=[...catalog.hosts,...draft.hosts.filter(id=>!catalog.hosts.some(h=>h.id===id)).map(id=>({id,name:t('missing')+' · '+id.slice(0,8)}))].filter(h=>h.name.toLowerCase().includes(query));hosts.forEach(h=>{const label=el('label');label.className='choice';const input=el('input');input.type='checkbox';input.value=h.id;input.checked=draft.hosts.includes(h.id);label.append(input,el('span',h.name));input.onchange=()=>{draft.hosts=input.checked?[...draft.hosts,h.id]:draft.hosts.filter(id=>id!==h.id);$('host-count').textContent=String(draft.hosts.length);updateSave();};list.append(label);});if(!hosts.length)list.append(el('p',t('noMatches')));}
function renderTokens(){const principal=selected==='admin'?state.actor.id:selected,list=tokens.filter(c=>c.principal_id===principal);$('tokens-empty').hidden=list.length>0;$('token-list').replaceChildren();list.forEach(c=>{const row=el('tr'),name=el('td',c.label);name.append(el('small',c.id.slice(0,10)));row.append(name,el('td',new Date(c.created_at).toLocaleDateString(lang)));const cell=el('td'),button=el('button',t('revoke'));button.type='button';button.className='danger';button.onclick=async()=>{if(!confirm(t('revokeConfirm')))return;setBusy(true);try{await request('/auth/tokens/'+encodeURIComponent(c.id),{method:'DELETE'});if(revealed?.credential.id===c.id)clearRevealed();await reload();feedback(t('saved'),'success');}catch(e){fail(e,'token-error');}finally{setBusy(false);}};cell.append(button);row.append(cell);$('token-list').append(row);});}
async function reload(){const data=await Promise.all([request('/auth/agents'),request('/auth/tokens')]);agents=data[0].agents;tokens=data[1].tokens;renderList();renderTokens();}
function clearRevealed(){revealed=null;$('token-config').value='';$('token-result').hidden=true;$('copy-state').textContent='';}
function renderConfig(){if(!revealed)return;const mode=$('config-mode').value;let entry;if(mode==='http'||mode==='sse')entry={url:location.origin+(mode==='sse'?'/sse':'/stream'),headers:{Authorization:'Bearer '+revealed.token}};else{const args=['-y','@open-mcp-ai/termcp'];if(mode==='daemon')args.push('daemon');args.push('stdio');if(mode==='stdio')args.push(location.origin+'/stream');else args.push('--host',location.hostname.replace(/^\[|\]$/g,''),'--port',location.port||(location.protocol==='https:'?'443':'80'));entry={command:'npx',args,env:{TERMCP_MCP_TOKEN:revealed.token}};}$('token-config').value=JSON.stringify({mcpServers:{termcp:entry}},null,2);$('token-result').hidden=false;}
$('new-agent').onclick=()=>{if(!safeSwitch())return;$('new-agent-form-wrap').hidden=false;$('agent-name').focus();};
$('new-agent-form').onsubmit=async e=>{e.preventDefault();if(!safeSwitch())return;setBusy(true);$('create-error').textContent='';try{const result=await request('/auth/agents',{method:'POST',body:JSON.stringify({name:$('agent-name').value,issue_token:false,policy:{functions:[],host_mode:'none',hosts:[]}})});await reload();select(result.agent.id,true);$('new-agent-form').reset();$('new-agent-form-wrap').hidden=true;feedback(t('created'),'success');}catch(error){fail(error,'create-error');}finally{setBusy(false);}};
$('save-policy').onclick=async()=>{const a=agents.find(a=>a.id===selected);setBusy(true);$('policy-error').textContent='';try{const result=await request('/auth/agents/'+encodeURIComponent(a.id),{method:'PATCH',body:JSON.stringify({policy:draft,revision:a.revision})});agents=agents.map(old=>old.id===a.id?result.agent:old);original=JSON.stringify(draft);feedback(t('policySaved'),'success');}catch(error){fail(error,'policy-error');}finally{setBusy(false);}};
$('toggle-agent').onclick=async()=>{const a=agents.find(a=>a.id===selected);setBusy(true);$('policy-error').textContent='';try{const result=await request('/auth/agents/'+encodeURIComponent(a.id),{method:'PATCH',body:JSON.stringify({enabled:!a.enabled,revision:a.revision})});agents=agents.map(old=>old.id===a.id?result.agent:old);renderList();renderDetail();feedback(t('saved'),'success');}catch(error){fail(error,'policy-error');}finally{setBusy(false);}};
$('token-form').onsubmit=async e=>{e.preventDefault();if(revealed){feedback(t('saveFirst'),'error','token-error');return;}if(changed()){feedback(t('saveBeforeToken'),'error','token-error');return;}setBusy(true);$('token-error').textContent='';try{revealed=await request('/auth/tokens',{method:'POST',body:JSON.stringify({agent_id:selected==='admin'?'':selected,label:$('token-label').value})});renderConfig();await reload();$('token-form').reset();feedback(t('tokenSaved'),'success');}catch(error){fail(error,'token-error');}finally{setBusy(false);}};
$('role-form').onsubmit=async e=>{e.preventDefault();setBusy(true);try{const admin=roles.permissions.admin.filter(p=>p!=='mcp');if($('admin-mcp').checked)admin.push('mcp');roles=await request('/auth/permissions',{method:'PUT',body:JSON.stringify({revision:roles.revision,permissions:{admin,agent:$('agent-mcp').checked?['mcp']:[]}})});feedback(t('roleSaved'),'success');}catch(error){fail(error);}finally{setBusy(false);}};
$('select-functions').onclick=()=>{const available=catalog.functions.filter(g=>draft.host_mode==='all'||!['profile_write','extension'].includes(g.id)).map(g=>g.id);draft.functions=available.every(id=>draft.functions.includes(id))?[]:available;renderFunctions();updateSave();};
document.querySelectorAll('[name=host-mode]').forEach(input=>input.onchange=()=>{draft.host_mode=input.value;draft.hosts=[];if(input.value!=='all'){const old=draft.functions.length;draft.functions=draft.functions.filter(id=>!['profile_write','extension'].includes(id));if(old!==draft.functions.length)feedback(t('globalRemoved'));}renderFunctions();renderHosts();updateSave();});
$('policy-tab').onclick=()=>setTab('policy');$('tokens-tab').onclick=()=>{setTab('tokens');renderConfig();};$('host-search').oninput=renderHosts;$('config-mode').onchange=renderConfig;$('dismiss-token').onclick=clearRevealed;$('language').onchange=e=>{lang=e.target.value;renderLanguage();};
$('copy-config').onclick=async()=>{try{await navigator.clipboard.writeText($('token-config').value);$('copy-state').textContent=t('copied');}catch{$('token-config').select();$('copy-state').textContent=t('manualCopy');}};
window.addEventListener('beforeunload',e=>{if(changed()||revealed){e.preventDefault();e.returnValue='';}});
async function load(){renderLanguage();feedback(t('loading'));setBusy(true);try{state=await request('/auth/status');if(!state.authenticated){location.replace('/login');return;}const data=await Promise.all([request('/auth/access'),request('/auth/permissions')]);catalog=data[0];roles=data[1];$('admin-mcp').checked=roles.permissions.admin.includes('mcp');$('agent-mcp').checked=roles.permissions.agent.includes('mcp');await reload();if(agents.length)select(agents[0].id,true);feedback(t('intro'));$('config-mode').querySelector('[value=daemon]').hidden=!/^(localhost|127\.0\.0\.1|\[?::1\]?)$/.test(location.hostname);}catch(error){fail(error);}finally{setBusy(false);}}
load();
</script></body></html>
