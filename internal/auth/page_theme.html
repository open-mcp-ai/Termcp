{{define "theme-head"}}
<!-- This palette also keeps docs-only builds and unavailable theme assets usable. -->
<style>
:root{color-scheme:light;--bg-canvas:#f3f4f6;--bg-card:#fff;--bg-input:#f7f8fa;--text-primary:#292e36;--text-secondary:#515b69;--border-subtle:#dfe3e9;--accent:#4470b2;--accent-surface:#e8eff9;--danger:#a73543;--success:#236346;--text-on-accent:#fff;--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg-canvas:#181b21;--bg-card:#22262e;--bg-input:#181b21;--text-primary:#edf0f5;--text-secondary:#b5bdca;--border-subtle:#454d5b;--accent:#94b9ef;--accent-surface:#293a51;--danger:#ffabb5;--success:#96d3b3;--text-on-accent:#172740}}
</style>
{{if .Themes}}
<link id="termcp-theme" rel="stylesheet" href="auth/ui/themes/default-light/theme.css">
<link rel="stylesheet" href="auth/ui/static/css/theme-boot.css">
<script nonce="{{.Nonce}}" src="auth/ui/static/theme-boot.js"></script>
{{end}}
<style>
.auth-page{--canvas:var(--bg-canvas);--paper:var(--bg-card);--ink:var(--text-primary);--muted:var(--text-secondary);--line:var(--border-subtle);--error:var(--danger);--button-ink:var(--text-on-accent);--selected:var(--accent-surface);--good:var(--success);scrollbar-color:var(--line) var(--canvas)}
.auth-page .page-controls{display:flex;align-items:center;gap:12px;margin-inline-start:auto}
.auth-page .page-controls select{margin:0;font-size:14px}
.auth-page .theme-label{display:inline}
.auth-page .theme-btn{width:auto;height:auto;min-height:36px;white-space:nowrap}
.auth-page .theme-btn svg{flex:none}
.auth-page .theme-menu{z-index:20}
.auth-page .theme-menu button{filter:none;min-height:36px;text-align:start;color:var(--ink);background:transparent}
.auth-page .theme-menu button:hover{background:var(--selected)}
.auth-page .theme-menu button[aria-pressed=true]{background:var(--selected);color:var(--accent)}
.auth-page .theme-menu p{margin:0}
.auth-page input::placeholder,.auth-page textarea::placeholder{color:var(--muted);opacity:1}
.auth-page .primary,.auth-page #submit,.auth-page #change-password button{background:var(--selected);color:var(--ink);border:1px solid var(--accent)}
@media(max-width:700px){.auth-page>header{flex-wrap:wrap;padding-block:12px;gap:12px}.auth-page>header nav{order:3;width:100%;flex-wrap:wrap}.auth-page .page-controls{gap:8px}}
@media(max-width:420px){.auth-page .theme-label{display:none}}
</style>
{{end}}
{{define "theme-picker"}}{{if .Themes}}
<details class="theme-switch" id="theme-switch">
  <summary class="theme-btn" title="Theme"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 2v12M8 2a6 6 0 0 1 0 12" fill="currentColor"/></svg><span class="theme-label" data-text="theme.label">Theme</span><span id="theme-current"></span></summary>
  <div class="theme-menu"><div id="theme-options" class="theme-options"></div><p id="theme-status" class="theme-status" role="status"></p></div>
</details>
{{end}}{{end}}
{{define "theme-script"}}{{if .Themes}}
<script nonce="{{.Nonce}}" src="auth/ui/static/js/theme.js"></script>
{{end}}{{end}}
