<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Termcp</title>
  <style>
    :root{color-scheme:light dark;--canvas:#f3f4f6;--paper:#fff;--ink:#292e36;--muted:#515b69;--line:#dfe3e9;--accent:#4470b2;--error:#a73543;--button-ink:#fff}
    @media(prefers-color-scheme:dark){:root{--canvas:#181b21;--paper:#22262e;--ink:#edf0f5;--muted:#b5bdca;--line:#454d5b;--accent:#94b9ef;--error:#ffabb5;--button-ink:#172740}}
    *{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:32px 20px}main{width:100%;max-width:420px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:48px}.brand{font-weight:650;font-size:20px;letter-spacing:-.02em}select{border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);padding:6px;font:inherit;font-size:13px}h1{font-size:30px;line-height:1.2;letter-spacing:-.025em;margin:0 0 12px}p{color:var(--muted);margin:0 0 28px}form{display:grid;gap:20px}label{display:grid;gap:8px;font-size:14px;font-weight:550}input[type=text],input[type=password]{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit}input{caret-color:var(--accent)}button,.workspace{min-height:44px;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:550;cursor:pointer}button{background:var(--accent);color:var(--button-ink)}button:hover{filter:brightness(.92)}button:disabled{opacity:.6;cursor:wait}button.secondary{background:var(--paper);color:var(--ink);border:1px solid var(--line)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}#message{min-height:24px;margin:20px 0 0;font-size:14px;color:var(--error);overflow-wrap:anywhere}.workspace{display:block;text-align:center;text-decoration:none;color:var(--accent);border:1px solid var(--line);margin-top:28px}fieldset{border:0;border-top:1px solid var(--line);padding:24px 0 0;margin:28px 0 0}legend{font-weight:600;padding:0 8px 0 0}fieldset label{display:flex;align-items:center;gap:10px;margin:12px 0;font-weight:400}input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}#master-password-details{margin-top:28px;border-top:1px solid var(--line);padding-top:20px}#master-password-details summary{font-weight:550;cursor:pointer}#change-password fieldset{margin:0;border:0;padding-top:16px}#change-password fieldset label{display:grid;gap:8px}#change-password p{font-size:14px;margin:12px 0 20px}#unlock-choice{display:flex;align-items:center;gap:10px;font-weight:400}[hidden]{display:none!important}::selection{background:#cbdcf6;color:#1d232c}@media(max-width:480px){header{margin-bottom:36px}body{place-items:start center;padding-top:40px}}
  main.account-view{max-width:760px}#message:not(:empty){position:sticky;top:12px;background:var(--paper);padding:12px 16px;border:1px solid var(--error);border-radius:8px;z-index:5}#change-password fieldset{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}#change-password p{grid-column:1/-1}@media(max-width:700px){#change-password fieldset{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <header><span class="brand">Termcp</span><select id="language" aria-label="Language"><option value="en">English</option><option value="zh">中文</option></select></header>
  <h1 id="title">Sign in</h1>
  <p id="description" role="status">Checking your account…</p>
  <p id="message" role="alert" aria-live="assertive"></p>
  <form id="credentials" hidden>
    <label><span data-text="username">Username</span><input id="username" name="username" type="text" autocomplete="username" maxlength="128" required></label>
    <label><span data-text="password">Password</span><input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required></label>
    <label id="confirmation" hidden><span data-text="confirm">Confirm password</span><input id="confirm" type="password" autocomplete="new-password" maxlength="1024"></label>
    <label id="previous-config" hidden><span data-text="previousConfig">Previous configuration password (if different)</span><input id="config-password" type="password" autocomplete="off" maxlength="1024"></label>
    <label id="unlock-choice" hidden><input id="automatic-unlock" type="checkbox"><span data-text="automaticUnlock">Allow automatic unlock on this device when available</span></label>
    <button id="submit" type="submit">Sign in</button>
  </form>
  <section id="account" hidden>
    <a class="workspace" href="/permissions" data-text="permissionsPage">权限管理</a>
    <details id="master-password-details"><summary id="master-password-summary" data-text="changePassword">Change master password</summary>
    <form id="change-password">
      <fieldset aria-labelledby="master-password-summary">
        <p data-text="changeHint">This also changes the configuration encryption password and signs out all sessions.</p>
        <label><span data-text="currentPassword">Current password</span><input id="current-password" type="password" autocomplete="current-password" required maxlength="1024"></label>
        <label><span data-text="newPassword">New password</span><input id="new-password" type="password" autocomplete="new-password" required minlength="8" maxlength="1024"></label>
        <label><span data-text="confirm">Confirm password</span><input id="new-confirm" type="password" autocomplete="new-password" required minlength="8" maxlength="1024"></label>
      </fieldset>
      <button type="submit" data-text="changePassword">Change master password</button>
    </form></details>
    <a class="workspace" href="/" data-text="workspace">Back to workspace</a>
    <button id="logout" class="secondary" type="button" style="width:100%;margin-top:16px" data-text="logout">Sign out</button>
  </section>

</main>
<script nonce="{{.Nonce}}">
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id);};
  var lang=/^zh/i.test(navigator.language)?'zh':'en',state=null;
  var copy={en:{username:'Username',password:'Master password',confirm:'Confirm password',signIn:'Sign in',setup:'Create admin account',setupHint:'Create the Admin account. This master password also unlocks encrypted configurations.',loginHint:'Use your admin account to open this workspace.',account:'Account',signedIn:'Signed in as ',local:'Open Termcp on its own machine, or use SSH port forwarding, to create the first admin account.',roles:'Role access',adminMCP:'Admin can use MCP',agentMCP:'Agent can use MCP',save:'Save permissions',workspace:'Back to workspace',logout:'Sign out',waiting:'Please wait…',mismatch:'Passwords do not match.',minPassword:'Use at least 8 characters for your password.',network:'Could not connect. Check that Termcp is running, then try again.',saved:'Permissions saved.',loading:'Checking your account…',previousConfig:'Previous configuration password (if different)',automaticUnlock:'Allow automatic unlock on this device when available',unlockHint:'Sign in with your master password to unlock this instance.',migrationHint:'Sign in to encrypt your account and use one master password. Enter the previous configuration password if it differs.',changePassword:'Change master password',changeHint:'This also changes the configuration encryption password and signs out all sessions.',currentPassword:'Current password',newPassword:'New password'},zh:{username:'用户名',password:'主密码',confirm:'确认密码',signIn:'登录',setup:'设置管理员',setupHint:'设置管理员账号。登录和加密配置解锁共用这一主密码。',loginHint:'使用管理员账号进入工作区。',account:'账号',signedIn:'当前账号：',local:'请在 Termcp 所在机器打开页面，或通过 SSH 本地转发完成首次设置。',roles:'角色访问权限',adminMCP:'允许管理员使用 MCP',agentMCP:'允许 Agent 使用 MCP',save:'保存权限',workspace:'返回工作区',logout:'退出登录',waiting:'请稍候…',mismatch:'两次输入的密码不一致。',minPassword:'密码至少需要 8 个字符。',network:'无法连接，请确认 Termcp 正在运行后重试。',saved:'权限已保存。',loading:'正在检查账号…',previousConfig:'原配置加密密码（不同时填写）',automaticUnlock:'在此设备支持时允许自动解锁',unlockHint:'输入主密码，登录并解锁此实例。',migrationHint:'登录后将加密账号数据并统一主密码。原配置加密密码不同时，请一并填写。',changePassword:'修改主密码',changeHint:'同时更新配置加密密码，并使所有登录会话失效。',currentPassword:'当前密码',newPassword:'新密码'}};
  copy.en.permissionsPage='Permission management';copy.zh.permissionsPage='权限管理';
  function t(key){return copy[lang][key]||key;}
  function render(){
    document.documentElement.lang=lang;$('language').value=lang;
    document.querySelectorAll('[data-text]').forEach(function(el){el.textContent=t(el.dataset.text);});
    if(!state){$('description').textContent=t('loading');return;}
    var setup=!state.configured,auth=state.authenticated;
    $('title').textContent=t(auth?'account':setup?'setup':'signIn');document.title=$('title').textContent+' · Termcp';
    document.querySelector('main').classList.toggle('account-view',!!auth);
    $('description').textContent=auth?t('signedIn')+state.actor.username:setup?(state.can_setup?t('setupHint'):t('local')):t(state.migration_required?'migrationHint':state.locked?'unlockHint':'loginHint');
    $('previous-config').hidden=auth||!state.encryption_initialized||!(setup||state.migration_required);$('unlock-choice').hidden=auth||!(setup||state.migration_required||state.locked);
    $('credentials').hidden=auth||(setup&&!state.can_setup);$('account').hidden=!auth;$('confirmation').hidden=!setup;
    $('confirm').required=setup;$('password').autocomplete=setup?'new-password':'current-password';$('password').minLength=setup?8:1;$('submit').textContent=t(setup?'setup':'signIn');
  }
  function request(path,options){options=options||{};options.headers=Object.assign({'Content-Type':'application/json','X-Termcp-CSRF':state&&state.csrf||''},options.headers||{});return fetch(path,options).then(function(r){return r.json().then(function(data){if(!r.ok)throw new Error(data.error||String(r.status));return data;});});}
  function failed(e){$('message').textContent=e instanceof TypeError?t('network'):e.message;$('message').scrollIntoView({block:'nearest'});}
  function load(){return request('/auth/status').then(function(data){state=data;render();}).catch(failed);}
  $('language').onchange=function(){lang=this.value;render();};
  $('credentials').onsubmit=function(e){e.preventDefault();$('message').textContent='';var setup=!state.configured;if(setup&&$('password').value!==$('confirm').value){$('message').textContent=t('mismatch');return;}$('submit').disabled=true;$('submit').textContent=t('waiting');request(setup?'/auth/setup':'/auth/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value,config_password:$('config-password').value,automatic_unlock:$('automatic-unlock').checked})}).then(function(){location.replace('/');}).catch(function(e){failed(e);$('submit').disabled=false;render();});};
  $('logout').onclick=function(){this.disabled=true;request('/auth/logout',{method:'POST'}).then(function(){location.replace('/login');}).catch(function(e){$('logout').disabled=false;failed(e);});};
  $('change-password').onsubmit=function(e){e.preventDefault();$('message').textContent='';if($('new-password').value!==$('new-confirm').value){$('message').textContent=t('mismatch');return;}var button=this.querySelector('button');button.disabled=true;request('/auth/password',{method:'POST',body:JSON.stringify({current_password:$('current-password').value,new_password:$('new-password').value,confirmation:$('new-confirm').value})}).then(function(){location.replace('/login');}).catch(failed).finally(function(){button.disabled=false;});};
  render();load();
})();
</script>
</body>
</html>
