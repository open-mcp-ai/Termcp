name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # -race needs cgo; all three runner images ship a gcc (windows: 15.2.0).
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check release metadata
        env:
          RELEASE_PR_HEAD_REF: ${{ github.head_ref }}
          RELEASE_PR_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/release_metadata.py check

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Test
        # Keep these flags in sync with the Makefile `test` target; the stress
        # variant (make test-stress) perturbs scheduling to flush out lifecycle
        # races that -race cannot see. See docs/agents/testing.md.
        run: go test ./... -count=1 -shuffle=on -race -timeout 240s

      - name: Test pure-API build
        run: |
          go build -tags no_webui ./...
          go test -tags no_webui -count=1 -race -run TestNoWebUIBuildCarriesDocsOnly ./internal/webui/
