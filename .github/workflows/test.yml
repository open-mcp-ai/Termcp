name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      # EVERY LEG FINISHES, EVEN WHEN ONE FAILS. The default fail-fast cancels the
      # remaining jobs the moment the first one goes red, so a macOS-only flake reported
      # as "windows: canceled" and the next round had to be spent guessing whether Windows
      # passed or simply never ran. Three verdicts cost the same minutes as one.
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      # -race needs cgo; all three runner images ship a gcc (windows: 15.2.0).
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check release metadata
        env:
          RELEASE_PR_HEAD_REF: ${{ github.head_ref }}
          RELEASE_PR_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/release_metadata.py check

      # Self-check for the same script: pins the pre-release rule (an -rc.N tag
      # must not move server.json) that the version test in internal/mcp covers
      # from the other side.
      - name: Check release metadata script
        run: python -m unittest discover -s scripts -p '*_test.py'

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Test
        # Keep these flags in sync with the Makefile `test` target; the stress
        # variant (make test-stress) perturbs scheduling to flush out lifecycle
        # races that -race cannot see. See docs/agents/testing.md.
        #
        # The TIMEOUT is the one flag that deliberately differs from `make test`.
        # -timeout is a hang detector, not a budget, and 600s was tuned against
        # this desk (internal/mcp alone measures 168-196s here, issue #189). A
        # shared runner is several times slower under -race — two vCPUs, a cold
        # page cache and three OSes' worth of neighbours — so the same package can
        # cross 600s while still making progress, and the run dies with
        # "panic: test timed out" that names no failing test. 1800s is still a hang
        # detector (a real hang sits there doing nothing); the job-level
        # timeout-minutes is what stops a wedged runner.
        timeout-minutes: 45
        run: go test ./... -count=1 -shuffle=on -race -timeout 1800s

      - name: Test pure-API build
        run: |
          go build -tags no_webui ./...
          go test -tags no_webui -count=1 -race -run TestNoWebUIBuildCarriesDocsOnly ./internal/webui/
