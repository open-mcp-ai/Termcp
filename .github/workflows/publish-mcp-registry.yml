name: Publish to MCP Registry

# Builds and pushes the termcp OCI image to GHCR, then publishes server.json
# to the MCP Registry under the io.github.open-mcp-ai/ namespace via OIDC.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # MCP Registry OIDC authentication
      contents: read
      packages: write # push to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/open-mcp-ai/termcp
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sync version into server.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          jq --arg v "$VERSION" \
            '.version = $v | .packages[0].identifier = "ghcr.io/open-mcp-ai/termcp:" + $v' \
            server.json > server.tmp && mv server.tmp server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        if: startsWith(github.ref, 'refs/tags/')
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        if: startsWith(github.ref, 'refs/tags/')
        run: ./mcp-publisher publish
