name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check release metadata
        run: python3 scripts/release_metadata.py check --expected "$GITHUB_REF_NAME"

      - name: Build
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:?release tag is required}"
          COMMIT="$(git rev-parse --short HEAD 2>/dev/null || true)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.version=$VERSION"
          if [ -n "$COMMIT" ]; then LDFLAGS="$LDFLAGS -X main.commit=$COMMIT"; fi
          if [ -n "$DATE" ]; then LDFLAGS="$LDFLAGS -X main.date=$DATE"; fi
          PLATFORMS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )
          for PLATFORM in "${PLATFORMS[@]}"; do
            GOOS="${PLATFORM%%/*}"
            GOARCH="${PLATFORM##*/}"
            BINARY="termcp-${GOOS}-${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              BINARY="${BINARY}.exe"
            fi
            echo "Building ${BINARY} (${VERSION})..."
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -ldflags="$LDFLAGS" \
              -o "dist/${BINARY}" \
              .
          done

      - name: Compress
        run: |
          # A SINGLE-FILE .gz PER PLATFORM, published NEXT TO the raw executables.
          # The npm wrapper prefers these: `curl -fsSL <asset>.gz | gunzip > termcp`
          # is one pipe with no tar to unpack, and for a package that is one file a
          # tarball was only ever tar's header around the same bytes.
          #
          # -n keeps the name and timestamp out of the header, so the same build
          # produces the same bytes on any runner; a release asset that changes
          # hash between runs is a release asset nobody can verify.
          for f in dist/termcp-*; do
            case "$f" in
              *.gz) continue ;;
            esac
            gzip -9 -n -c "$f" > "$f.gz"
          done
          # The binaries are single files with nowhere to carry a licence, and the
          # vendored terminal's NOTICE is deliberately not inside the binary either
          # (see docs/xterm.md). So the notices ride beside them: one asset per
          # release, next to every download, plus LICENSE for this project.
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          ls -l dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # An rc tag is an internal test build: mark it as a pre-release so it
          # is not offered as "the latest release" on the repository page.
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          files: dist/*
